<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trafree — Vistas Mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1c30] text-white min-h-screen font-['Inter'] flex flex-col lg:flex-row">
  <aside class="w-full lg:w-80 bg-[#131b2e] border-b lg:border-b-0 lg:border-r border-white/10 p-5 flex flex-col gap-5 shrink-0">
    <div>
      <span class="text-[11px] font-bold uppercase tracking-widest text-[#3ce36a]">0% Comisiones</span>
      <h1 class="text-xl font-bold mt-1">Trafree Mockups</h1>
      <p class="text-xs text-slate-400 mt-1">Selecciona una vista para previsualizarla en marco móvil o abrirla directamente.</p>
    </div>

    <nav class="flex flex-col gap-2" id="view-nav">
      <button data-src="/views/inicio-viajes.html" class="view-btn text-left p-3 rounded-2xl bg-[#006e2a] text-white transition-all flex items-center justify-between gap-2">
        <div>
          <div class="font-semibold text-sm">1. Inicio Viajes</div>
          <div class="text-xs opacity-80">Pasajero • Pedir viaje</div>
        </div>
        <a href="/views/inicio-viajes.html" target="_blank" onclick="event.stopPropagation()" title="Abrir en pestaña nueva" class="p-1.5 rounded-lg hover:bg-white/15">
          <span class="material-symbols-outlined text-[18px]">open_in_new</span>
        </a>
      </button>

      <button data-src="/views/seguimiento-viaje.html" class="view-btn text-left p-3 rounded-2xl bg-white/5 hover:bg-white/10 text-slate-200 transition-all flex items-center justify-between gap-2">
        <div>
          <div class="font-semibold text-sm">2. Seguimiento De Viaje</div>
          <div class="text-xs opacity-70">Pasajero • Viaje en curso</div>
        </div>
        <a href="/views/seguimiento-viaje.html" target="_blank" onclick="event.stopPropagation()" title="Abrir en pestaña nueva" class="p-1.5 rounded-lg hover:bg-white/15">
          <span class="material-symbols-outlined text-[18px]">open_in_new</span>
        </a>
      </button>

      <button data-src="/views/conductor-solicitud.html" class="view-btn text-left p-3 rounded-2xl bg-white/5 hover:bg-white/10 text-slate-200 transition-all flex items-center justify-between gap-2">
        <div>
          <div class="font-semibold text-sm">3. Conductor • Solicitud</div>
          <div class="text-xs opacity-70">Conductor • Aceptar / Rechazar</div>
        </div>
        <a href="/views/conductor-solicitud.html" target="_blank" onclick="event.stopPropagation()" title="Abrir en pestaña nueva" class="p-1.5 rounded-lg hover:bg-white/15">
          <span class="material-symbols-outlined text-[18px]">open_in_new</span>
        </a>
      </button>

      <button data-src="/views/conductor-navegacion.html" class="view-btn text-left p-3 rounded-2xl bg-white/5 hover:bg-white/10 text-slate-200 transition-all flex items-center justify-between gap-2">
        <div>
          <div class="font-semibold text-sm">4. Conductor • Navegación</div>
          <div class="text-xs opacity-70">Conductor • En camino / Deslizar</div>
        </div>
        <a href="/views/conductor-navegacion.html" target="_blank" onclick="event.stopPropagation()" title="Abrir en pestaña nueva" class="p-1.5 rounded-lg hover:bg-white/15">
          <span class="material-symbols-outlined text-[18px]">open_in_new</span>
        </a>
      </button>
    </nav>
  </aside>

  <main class="flex-1 flex items-center justify-center p-4 lg:p-8">
    <div class="w-full max-w-[400px] h-[844px] max-h-[90vh] bg-white rounded-[2.5rem] shadow-2xl border-[8px] border-[#213145] overflow-hidden relative">
      <iframe id="preview-frame" src="/views/inicio-viajes.html" class="w-full h-full border-0" title="Trafree Vista"></iframe>
    </div>
  </main>

  <script>
    const buttons = document.querySelectorAll('.view-btn');
    const frame = document.getElementById('preview-frame');

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        buttons.forEach((b) => {
          b.classList.remove('bg-[#006e2a]', 'text-white');
          b.classList.add('bg-white/5', 'text-slate-200');
        });
        btn.classList.remove('bg-white/5', 'text-slate-200');
        btn.classList.add('bg-[#006e2a]', 'text-white');
        frame.src = btn.getAttribute('data-src');
      });
    });
  </script>
</body>
</html>
